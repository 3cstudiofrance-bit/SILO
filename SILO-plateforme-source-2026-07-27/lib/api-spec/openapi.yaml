openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: 3C Studio API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Public contact form
  - name: projects
    description: Client projects
  - name: quotes
    description: Quote requests
  - name: deliverables
    description: Project file deliverables
  - name: dashboard
    description: Dashboard stats and summaries
  - name: comments
    description: Project comments and correction requests
  - name: partner
    description: Partner portal missions
  - name: finance
    description: Transactions, split 70/20/10 and FRP (server-enforced)
  - name: feature-flags
    description: Activatable features (CDC §14) with server-side role enforcement
  - name: feed
    description: Unified project feed with server-enforced role visibility matrix
  - name: comm
    description: Client↔Agency direct communication rules (server-enforced)
  - name: users
    description: Administration of authenticated users

paths:
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List Clerk users with scoped project counts (admin)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a contact/inquiry form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Contact submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Validation error

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      description: Admins see all projects; clients see their own
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{id}/deliverables:
    get:
      operationId: listDeliverables
      tags: [deliverables]
      summary: List deliverables for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of deliverables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deliverable"
    post:
      operationId: addDeliverable
      tags: [deliverables]
      summary: Add a deliverable to a project (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverableInput"
      responses:
        "201":
          description: Deliverable added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"

  /projects/{id}/files:
    get:
      operationId: listProjectFiles
      tags: [deliverables]
      summary: List private project resources visible to a project member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectFile"
    post:
      operationId: addProjectFile
      tags: [deliverables]
      summary: Register an uploaded private project resource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectFileInput"
      responses:
        "201":
          description: Project file registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFile"
        "403":
          description: Forbidden

  /deliverables/{id}:
    patch:
      operationId: reviewDeliverable
      tags: [deliverables]
      summary: Review a deliverable
      description: Approves a deliverable for client access or requests corrections. Restricted to the assigned advisor and admins.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverableReviewInput"
      responses:
        "200":
          description: Deliverable reviewed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"
    delete:
      operationId: deleteDeliverable
      tags: [deliverables]
      summary: Delete a deliverable (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /deliverables/{id}/client-review:
    patch:
      operationId: reviewDeliverableAsClient
      tags: [deliverables]
      summary: Approve a SILO-reviewed deliverable or request changes as the project client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliverableClientReviewInput"
      responses:
        "200":
          description: Client review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"
        "403":
          description: Forbidden or feature disabled
        "409":
          description: Deliverable has not been approved by SILO

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List quotes
      description: Admins see all; clients see their own
      responses:
        "200":
          description: List of quotes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Submit a quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}:
    get:
      operationId: getQuote
      tags: [quotes]
      summary: Get a quote by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
    patch:
      operationId: updateQuote
      tags: [quotes]
      summary: Update quote status/amount (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{id}/reserve:
    post:
      operationId: reserveQuote
      tags: [quotes]
      summary: Reserve an unassigned quote request
      description: Atomically assigns an open request to the authenticated advisor, subject to the 80-case capacity limit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quote request reserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          description: Request unavailable or advisor capacity reached

  /quotes/{id}/treatment:
    post:
      operationId: updateQuoteTreatment
      tags: [quotes]
      summary: Persist an operational treatment action on an assigned quote request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteTreatmentInput"
      responses:
        "200":
          description: Updated quote workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "403":
          description: Forbidden
        "409":
          description: Invalid workflow transition

  /projects/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized
    post:
      operationId: addComment
      tags: [comments]
      summary: Add a comment to a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          description: Unauthorized

  /partner/missions:
    get:
      operationId: listPartnerMissions
      tags: [partner]
      summary: List partner missions (admin sees all, partner sees own)
      responses:
        "200":
          description: List of missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerMission"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createPartnerMission
      tags: [partner]
      summary: Create a partner mission (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerMissionInput"
      responses:
        "201":
          description: Mission created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerMission"

  /partners:
    get:
      operationId: listPartners
      tags: [partner]
      summary: List partners in the caller's scope
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"
    post:
      operationId: createPartner
      tags: [partner]
      summary: Create a partner profile (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerInput"
      responses:
        "201":
          description: Partner created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"

  /partners/{id}:
    patch:
      operationId: updatePartner
      tags: [partner]
      summary: Update a partner profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerUpdate"
      responses:
        "200":
          description: Partner updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Partner"

  /partner/missions/{id}:
    patch:
      operationId: updatePartnerMission
      tags: [partner]
      summary: Update a partner mission status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerMissionUpdate"
      responses:
        "200":
          description: Updated mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerMission"

  /transactions:
    get:
      operationId: listTransactions
      tags: [finance]
      summary: List transactions (role-shaped amounts)
      description: Admin/PM see full split; partners only their 70% share; clients only their totals
      responses:
        "200":
          description: Transactions visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"
    post:
      operationId: createTransaction
      tags: [finance]
      summary: Prepare a payment request (admin/PM) — split computed server-side
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
      responses:
        "201":
          description: Pending payment created with server-computed split
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "400":
          description: Validation error (e.g. below quote floor)
        "403":
          description: Forbidden

  /transactions/{id}/checkout:
    post:
      operationId: createTransactionCheckout
      tags: [finance]
      summary: Create or resume the authenticated client's Stripe Checkout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stripe-hosted payment URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionCheckout"
        "403":
          description: Forbidden
        "404":
          description: Transaction not found
        "409":
          description: Transaction is no longer payable
        "502":
          description: Payment provider unavailable
        "503":
          description: Payment provider not configured

  /frp/accounts:
    get:
      operationId: listFrpAccounts
      tags: [finance]
      summary: List FRP accounts (admin/PM all, partner own only)
      responses:
        "200":
          description: FRP accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrpAccount"
        "403":
          description: Forbidden

  /frp/movements:
    get:
      operationId: listFrpMovements
      tags: [finance]
      summary: List FRP movements (admin/PM all, partner own only)
      responses:
        "200":
          description: FRP movements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrpMovement"
        "403":
          description: Forbidden

  /reviews:
    get:
      operationId: listPartnerReviews
      tags: [partner]
      summary: List reviewable missions or recorded partner reviews for the caller
      responses:
        "200":
          description: Role-scoped review list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PartnerReview"
    post:
      operationId: createPartnerReview
      tags: [partner]
      summary: Review a completed and validated partner mission as its client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartnerReviewInput"
      responses:
        "201":
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerReview"
        "403":
          description: Forbidden
        "409":
          description: Mission not reviewable or already reviewed

  /feature-flags:
    get:
      operationId: getResolvedFeatureFlags
      tags: [feature-flags]
      summary: Resolved feature flags for the calling user
      responses:
        "200":
          description: Map of feature key to enabled, resolved for the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedFeatureFlags"

  /feature-flags/state:
    get:
      operationId: getFeatureFlagsState
      tags: [feature-flags]
      summary: Full feature flags state (admin/PM)
      responses:
        "200":
          description: Full state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagsState"
        "403":
          description: Forbidden

  /feature-flags/global/{key}:
    put:
      operationId: setGlobalFeatureFlag
      tags: [feature-flags]
      summary: Set or reset a global flag (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GlobalFlagUpdate"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagsState"
        "403":
          description: Forbidden

  /feature-flags/delegations/{key}:
    put:
      operationId: setFeatureFlagDelegation
      tags: [feature-flags]
      summary: Delegate (or revoke) a delegable key to the PM (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegationUpdate"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagsState"
        "403":
          description: Forbidden

  /feature-flags/overrides:
    post:
      operationId: createFeatureFlagOverride
      tags: [feature-flags]
      summary: Add a targeted override (admin, or PM if delegated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagOverrideInput"
      responses:
        "201":
          description: Override created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlagOverride"
        "403":
          description: Forbidden

  /feature-flags/overrides/{id}:
    delete:
      operationId: deleteFeatureFlagOverride
      tags: [feature-flags]
      summary: Remove an override (admin, or PM if delegated)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Override removed
        "403":
          description: Forbidden

  /feed/{projectId}:
    get:
      operationId: listFeedEntries
      tags: [feed]
      summary: List feed entries for a project (filtered by role server-side)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Feed entries visible to the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedEntry"
    post:
      operationId: createFeedEntry
      tags: [feed]
      summary: Post a message, note or escalation to the project feed
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedEntryInput"
      responses:
        "201":
          description: Entry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedEntry"
        "400":
          description: Validation error
        "403":
          description: Forbidden (role/channel not allowed)

  /comm/state:
    get:
      operationId: getCommState
      tags: [comm]
      summary: Full communication settings (admin/PM only)
      responses:
        "200":
          description: Global block and per-project settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommState"
        "403":
          description: Forbidden

  /comm/projects/{projectId}:
    get:
      operationId: getProjectCommStatus
      tags: [comm]
      summary: Communication status for a project (shaped by role)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project communication status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommProjectStatus"

  /comm/global-block:
    put:
      operationId: setCommGlobalBlock
      tags: [comm]
      summary: Set the global Client↔Agency block (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommGlobalBlockInput"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommState"
        "403":
          description: Forbidden

  /comm/projects/{projectId}/authorization:
    put:
      operationId: setCommAuthorization
      tags: [comm]
      summary: Authorize/revoke PM activation on a project (admin only)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommAuthorizationInput"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommState"
        "403":
          description: Forbidden

  /comm/projects/{projectId}/activation:
    put:
      operationId: setCommActivation
      tags: [comm]
      summary: Activate/deactivate direct communication (PM only, requires admin authorization)
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCommActivationInput"
      responses:
        "200":
          description: Updated project status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommProjectStatus"
        "403":
          description: Forbidden (no admin authorization or global block)

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard summary statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent project activity feed
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    FeedEntry:
      type: object
      required:
        [
          id,
          projectId,
          type,
          authorName,
          authorRole,
          content,
          internal,
          createdAt,
        ]
      properties:
        id:
          type: integer
        projectId:
          type: string
        type:
          type: string
          enum:
            [
              message,
