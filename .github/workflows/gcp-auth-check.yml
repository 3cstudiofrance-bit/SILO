name: Vérification Google Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-authentication:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: silo-88b1c
          workload_identity_provider: projects/131651476980/locations/global/workloadIdentityPools/github-silo-pool/providers/github-silo-provider
          service_account: github-silo-deployer@silo-88b1c.iam.gserviceaccount.com

      - name: Installer Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Vérifier l’accès
        run: |
          gcloud auth list
          gcloud config get-value project